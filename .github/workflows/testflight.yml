name: TestFlight

# Deploys to TestFlight from main ONLY.
# - Runs after a pull request is merged into main (push to main).
# - Skips automatically while other pull requests are still open, so we only ship
#   when no other branch is being worked on. Run it by hand from the Actions tab
#   ("Run workflow" on main) once those are done.
# - Never runs from a branch: the job is guarded by the main-ref check below.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  deploy:
    name: Build and upload to TestFlight
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check no other branches are in progress
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open_prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName \
            --jq 'map("#\(.number) (\(.headRefName))") | join(", ")')
          if [ -n "$open_prs" ]; then
            echo "::notice title=TestFlight skipped::Open pull requests: $open_prs. Merge or close them, then run this workflow from main."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check secrets are set
        if: steps.gate.outputs.skip == 'false'
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Add these repository secrets:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'

      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.gate.outputs.skip == 'false'
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        if: steps.gate.outputs.skip == 'false'
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write App Store Connect API key
        if: steps.gate.outputs.skip == 'false'
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Archive
        if: steps.gate.outputs.skip == 'false'
        run: |
          set -o pipefail
          # Build number must increase for every upload; offset leaves room for manual uploads.
          build_number=$(( 100 + GITHUB_RUN_NUMBER ))
          xcodebuild archive \
            -project Crusaders.xcodeproj \
            -scheme Crusaders \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Crusaders.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$build_number"

      - name: Upload to TestFlight
        if: steps.gate.outputs.skip == 'false'
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>DP3V39HSP5</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Crusaders.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
