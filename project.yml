name: Crusaders
options:
  bundleIdPrefix: com.randomedp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: DP3V39HSP5

packages:
  CrusadersKit:
    path: CrusadersKit

targets:
  Crusaders:
    type: application
    platform: iOS
    sources:
      - Crusaders
    dependencies:
      - package: CrusadersKit
    info:
      path: Crusaders/Info.plist
      properties:
        CFBundleDisplayName: Crusaders
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        CrusadersCloudKitEnabled: $(CLOUDKIT_ENABLED)
        UIBackgroundModes: [remote-notification]
        # Private DM-to-player chats are CloudKit shares (see CloudKitChatService).
        CKSharingSupported: true
        # Parchment theme: always light, with bundled OFL fonts (Crusaders/Resources/Fonts).
        UIUserInterfaceStyle: Light
        UIAppFonts:
          - GrenzeGotisch-SemiBold.ttf
          - EBGaramond-Regular.ttf
          - EBGaramond-SemiBold.ttf
          - EBGaramond-Italic.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.randomedp.Crusaders
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # iCloud is on (container iCloud.com.randomedp.Crusaders, set up 2026-11-28).
        # Release builds use it; Debug builds only with the -useCloudKit launch argument.
        CODE_SIGN_ENTITLEMENTS: Crusaders/Crusaders.entitlements
        CLOUDKIT_ENABLED: YES

  CrusadersTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CrusadersTests
    dependencies:
      - target: Crusaders
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.randomedp.Crusaders.tests

  CrusadersUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CrusadersUITests
    dependencies:
      - target: Crusaders
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.randomedp.Crusaders.uitests

schemes:
  Crusaders:
    build:
      targets:
        Crusaders: all
    test:
      gatherCoverageData: true
      targets:
        - CrusadersTests
        - CrusadersUITests
